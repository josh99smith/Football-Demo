<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>UI preview</title>
  <link rel="stylesheet" href="../src/style.css" />
  <style>
    /* Stand-in for the live WebGL field so we can eyeball HUD/control contrast
       without launching the full game. (DOM/CSS only — this is a layout proof.) */
    #scene { background: linear-gradient(180deg, #1c3b6e 0 18%, #2f7d44 18% 100%); }
    body::after { content: ""; position: fixed; inset: 18% 0 0 0; z-index: -1;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 2px, transparent 2px 64px),
        repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 64px); }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="rotate">
    <div class="rot-phone"><span class="rot-arrow">⟳</span></div>
    <div class="rot-text">Rotate your device<br><b>landscape mode</b></div>
  </div>

  <div id="ratecard">
    <div class="rc-role">QB</div>
    <div class="rc-row"><span>SPD</span><div class="rc-bar"><i style="width:80%"></i></div><b>80</b></div>
    <div class="rc-row"><span>STR</span><div class="rc-bar"><i style="width:73%"></i></div><b>73</b></div>
    <div class="rc-row"><span>STA</span><div class="rc-bar"><i style="width:88%"></i></div><b>88</b></div>
  </div>

  <div id="hud">
    <div id="topbar">
      <div class="tb-team off"><span class="tb-tag">OFF</span><b>21</b></div>
      <div class="tb-mid">
        <div class="tb-clock"><b>1:12</b><i>2ND</i></div>
        <div class="tb-chains"><span>OFF · 2nd &amp; 8</span><span id="playclock" class="playclock warn">:04</span></div>
      </div>
      <div class="tb-team def"><b>14</b><span class="tb-tag">DEF</span></div>
    </div>
    <div id="status">HURDLE available — tap ACTION!</div>
  </div>

  <div id="joystick" class="joystick"><div id="joystick-knob" class="joystick-knob" style="transform:translate(18px,-10px)"></div></div>
  <div id="action-btn" class="action-btn hot"><b id="action-label">HURDLE</b></div>
  <div id="turbo-btn" class="mini-btn turbo"><div id="turbo-fill" style="height:62%"></div><span>TURBO</span></div>
  <button id="fs-btn" class="fs-btn" aria-label="Toggle fullscreen">⛶</button>

  <!-- Play-select (shown with ?screen=play) -->
  <div id="playselect" class="hidden">
    <div class="ps-head"><span class="ps-side">OFFENSE</span><span class="ps-title">CHOOSE YOUR PLAY</span></div>
    <div class="ps-deck">
      <button class="ps-arrow" disabled>‹</button>
      <div class="ps-grid">
        <button class="ps-card chosen"><div class="ps-art"></div><i>1</i><b>BOMBS</b><span>Shots + RB check</span></button>
        <button class="ps-card"><div class="ps-art"></div><i>2</i><b>SLANTS</b><span>Quick slants + flat</span></button>
        <button class="ps-card"><div class="ps-art"></div><i>3</i><b>MESH</b><span>Crossers + swing</span></button>
        <button class="ps-card"><div class="ps-art"></div><i>4</i><b>FLOOD</b><span>Sidelines + flat</span></button>
      </div>
      <button class="ps-arrow">›</button>
    </div>
    <div class="ps-dots"><span class="ps-dot on"></span><span class="ps-dot"></span></div>
  </div>

  <script>
    if (new URLSearchParams(location.search).get('screen') === 'play')
      document.getElementById('playselect').classList.remove('hidden');
  </script>
</body>
</html>
