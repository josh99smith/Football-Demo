<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>7-on-7 Football</title>
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Loading…</div>
  </div>

  <!-- Portrait gate: this is a landscape game, so ask phones to rotate. -->
  <div id="rotate">
    <div class="rot-phone"><span class="rot-arrow">⟳</span></div>
    <div class="rot-text">Rotate your device<br><b>landscape mode</b></div>
  </div>

  <canvas id="scene"></canvas>

  <div id="build-badge"></div>
  <!-- Controlled-player ratings card -->
  <div id="ratecard" class="hidden"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="topbar">
      <div class="tb-team off"><span class="tb-tag">OFF</span><b id="score-off">0</b></div>
      <div class="tb-mid">
        <div class="tb-clock"><b id="game-clock">1:30</b><i id="quarter">1ST</i></div>
        <div class="tb-chains"><span id="downinfo">1st &amp; 30</span><span id="playclock" class="playclock">:15</span></div>
      </div>
      <div class="tb-team def"><b id="score-def">0</b><span class="tb-tag">DEF</span></div>
    </div>
    <div id="status">Tap SNAP to start the play</div>
  </div>

  <!-- Score flash -->
  <div id="flash"></div>

  <!-- Big center-screen hit/score callout -->
  <div id="banner"></div>

  <!-- Instant-replay broadcast overlay (letterbox + tag) -->
  <div id="replay" class="hidden">
    <div class="rp-bar rp-top"></div>
    <div class="rp-bar rp-bottom"></div>
    <div class="rp-tag"><span class="rp-dot"></span>INSTANT REPLAY</div>
    <div class="rp-skip">tap to skip</div>
  </div>

  <!-- 1-on-1 break-tackle battle (mash to break free) -->
  <div id="battle" class="hidden">
    <div id="battle-prompt">BREAK THE TACKLE!</div>
    <div id="battle-bar">
      <div id="battle-fill"></div>
      <div id="battle-div"></div>
    </div>
    <div id="battle-tap">TAP! &nbsp; TAP! &nbsp; TAP!</div>
  </div>

  <!-- Pre-snap play-select screen: 4 cards per page with scroll arrows -->
  <div id="playselect" class="hidden">
    <div class="ps-head">
      <span class="ps-side" id="ps-side">OFFENSE</span>
      <span class="ps-title" id="ps-title">CHOOSE YOUR PLAY</span>
    </div>
    <div class="ps-deck">
      <button class="ps-arrow" id="ps-prev" aria-label="Previous plays">‹</button>
      <div class="ps-grid">
        <button class="ps-card" data-slot="0"></button>
        <button class="ps-card" data-slot="1"></button>
        <button class="ps-card" data-slot="2"></button>
        <button class="ps-card" data-slot="3"></button>
      </div>
      <button class="ps-arrow" id="ps-next" aria-label="More plays">›</button>
    </div>
    <div class="ps-dots" id="ps-dots"></div>
  </div>

  <!-- Mobile touch joystick (left) -->
  <div id="joystick" class="joystick">
    <div id="joystick-knob" class="joystick-knob"></div>
  </div>

  <!-- Two-button control system: TURBO + a single contextual ACTION button
       (its label changes to show what it'll do: SNAP / THROW / HURDLE / TRUCK /
       DIVE / JUKE / TACKLE / SWITCH). -->
  <div id="action-btn" class="action-btn"><b id="action-label">SNAP</b></div>
  <div id="turbo-btn" class="mini-btn turbo"><div id="turbo-fill"></div><span>TURBO</span></div>

  <!-- Fullscreen toggle: hides the mobile browser chrome (address bar) so the
       play isn't cut off at the top. -->
  <button id="fs-btn" class="fs-btn" aria-label="Toggle fullscreen">⛶</button>

  <script type="module" src="src/main.js"></script>
</body>
</html>
